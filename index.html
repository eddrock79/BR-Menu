<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Rose Tavern — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/gqs7riy.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/*
 * Customer QR access window
 *
 * The printed QR opens the clean address: https://menuBR.hauntedpubs.co.uk/
 * A clean visit starts (or restarts) a two-hour window. We then add an
 * internal marker to the address so refreshing the page does not reset it.
 * Scanning the printed QR again opens the clean address and starts a fresh
 * two-hour window. The staff #bar screen is deliberately excluded.
 */
(function(){
  const ACCESS_DURATION_MS = 2 * 60 * 60 * 1000;
  const REDIRECT_URL = 'https://www.blackrosetavern.com/';
  const ACCESS_KEY = 'blackrose-menu-access-until-v1';
  const VISIT_MARKER = 'menu_access';
  let expiryTimer = null;
  let memoryExpiry = 0;

  function isBarScreen(){
    return window.location.hash === '#bar';
  }

  function redirectToWebsite(){
    window.location.replace(REDIRECT_URL);
  }

  function readExpiry(){
    try{
      const value = Number(window.localStorage.getItem(ACCESS_KEY));
      return Number.isFinite(value) && value > 0 ? value : memoryExpiry;
    }catch(error){
      return memoryExpiry;
    }
  }

  function saveExpiry(value){
    try{
      window.localStorage.setItem(ACCESS_KEY, String(value));
      return true;
    }catch(error){
      memoryExpiry = value;
      return false;
    }
  }

  function markVisit(){
    const url = new URL(window.location.href);
    url.searchParams.set(VISIT_MARKER, 'active');
    window.history.replaceState(null, '', url.pathname + url.search + url.hash);
  }

  function scheduleExpiry(){
    if(expiryTimer){
      window.clearTimeout(expiryTimer);
      expiryTimer = null;
    }
    if(isBarScreen()) return;

    const remaining = readExpiry() - Date.now();
    if(remaining <= 0){
      redirectToWebsite();
      return;
    }

    // Recheck periodically so returning to a suspended mobile tab still
    // redirects promptly once its two-hour window has ended.
    expiryTimer = window.setTimeout(scheduleExpiry, Math.min(remaining, 30000));
  }

  function initialiseQrAccess(){
    if(isBarScreen()) return;

    const url = new URL(window.location.href);
    const isFreshQrVisit = !url.searchParams.has(VISIT_MARKER);

    if(isFreshQrVisit){
      const expiresAt = Date.now() + ACCESS_DURATION_MS;
      if(!saveExpiry(expiresAt)){
        // Storage is unavailable: keep the expiry in the marked URL so the
        // current open page can still honour the two-hour countdown.
        url.searchParams.set(VISIT_MARKER, String(expiresAt));
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
      }else{
        markVisit();
      }
    }else if(!readExpiry()){
      const fallbackExpiry = Number(url.searchParams.get(VISIT_MARKER));
      if(!Number.isFinite(fallbackExpiry) || fallbackExpiry <= Date.now()){
        redirectToWebsite();
        return;
      }
      expiryTimer = window.setTimeout(redirectToWebsite, fallbackExpiry - Date.now());
      return;
    }

    scheduleExpiry();
  }

  window.addEventListener('hashchange', scheduleExpiry);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) scheduleExpiry();
  });

  initialiseQrAccess();
})();
</script>
<style>
  :root{
    --bg:#000000;
    --surface:#100D0E;
    --surface-2:#181315;
    --violet:#8C1F3D;
    --violet-bright:#B5294F;
    --brass:#C9A15A;
    --text:#F2EDE9;
    --text-dim:#B8ADA9;
    --success:#4C8C6B;
    --danger:#B5453F;
    --border:#34272B;
    --site-purple:#662D91;
    --site-green:#96BD0D;
    --saw-red:#8C1F3D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--violet); color:var(--text);}

  /* ---------- layout shell ---------- */
  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative;}
  header.topbar{
    padding:6px 16px 0 16px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    position:relative;
  }
  .brand-mark{display:flex; justify-content:center; margin:0 auto 2px auto; width:100%; padding:2px 0 4px;}
  .brand-logo{
    display:block; width:min(360px, 88vw); max-height:142px;
    object-fit:contain; object-position:center center; margin:0 auto; mix-blend-mode:screen;
  }
  .brand-text{
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .brand-text-the{
    font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; letter-spacing:0.4em;
    color:var(--brass); margin-bottom:2px;
  }
  .brand-text-name{
    font-family:'Oswald',sans-serif; font-size:27px; font-weight:700; letter-spacing:0.03em;
    line-height:1.05; color:var(--text); text-transform:uppercase;
  }
  .lock-btn{background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; padding:4px 0; white-space:nowrap;}

  main{flex:1; padding:6px 16px 60px 16px;}

  /* ---------- search + spin cta ---------- */
  .toolbar{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  input[type=text],input[type=number],textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:9px; font-size:14.5px;
  }
  #search-input{
    border-color:rgba(255,255,255,0.78);
    background:#050505;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  #search-input:focus{
    outline:none;
    border-color:#fff;
    box-shadow:0 0 0 2px rgba(150,189,13,0.18);
  }
  #search-input::placeholder{color:#B9AFB8;}
  textarea{resize:vertical; min-height:56px;}
  .spin-cta{
    position:relative; overflow:hidden; width:100%; min-height:62px; padding:10px 13px;
    display:grid; grid-template-columns:minmax(0,1fr) 18px; align-items:center; gap:12px;
    border:1px solid rgba(165,31,40,0.88); border-radius:3px; text-align:left;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 4px),
      linear-gradient(105deg, #090909, #171011 62%, #23090C);
    color:var(--text); box-shadow:inset 4px 0 0 var(--saw-red);
  }
  .spin-cta:active{background:#270A0D;}
  .spin-copy{display:block; min-width:0;}
  .spin-title{
    display:block; font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;
    line-height:1.08; letter-spacing:0.085em; text-transform:uppercase;
  }
  .spin-sub{display:block; margin-top:4px; color:#B9A7A9; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;}
  .spin-arrow{color:#D65059; font-size:24px; line-height:1; text-align:right;}

  .group-order-hero{
    width:100%;
    min-height:72px;
    padding:14px 16px;
    border:1px solid rgba(150,189,13,0.82);
    border-radius:4px;
    background:
      radial-gradient(circle at 28% 50%, rgba(102,45,145,0.52), transparent 44%),
      linear-gradient(110deg, #180B21 0%, #2A0E36 54%, #100A16 100%);
    box-shadow:inset 0 0 28px rgba(102,45,145,0.18);
    color:var(--text);
    text-align:center;
  }
  .group-order-hero:active{background:#24102F;}
  .group-order-hero .group-title{
    display:block;
    font-family:'gamay-narrow','Oswald',sans-serif;
    color:var(--site-green);
    font-size:17px;
    font-weight:600;
    letter-spacing:0.10em;
    text-transform:uppercase;
    line-height:1.1;
  }
  .group-order-hero .group-sub{
    display:block;
    margin-top:6px;
    color:#C9C0C9;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  /* ---------- drinks/food/members toggle ---------- */
  .group-toggle{display:flex; gap:0; background:var(--surface); border-radius:10px; padding:4px; border:1px solid var(--border); margin-bottom:10px;}
  .group-toggle-btn{
    flex:1; padding:10px 8px; border:none; background:transparent; color:var(--text-dim);
    font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    border-radius:7px; transition:background .15s, color .15s;
  }
  .group-toggle-btn.active{background:var(--violet-bright); color:#fff; box-shadow:inset 0 -2px 0 var(--brass);}

  /* ---------- category tabs ---------- */
  .cat-scroll{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px 0; -webkit-overflow-scrolling:touch;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  @media (hover:hover) and (pointer:fine){
    .cat-scroll{scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
    .cat-scroll::-webkit-scrollbar{display:block; height:6px;}
    .cat-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
    .cat-scroll::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
    .cat-scroll::-webkit-scrollbar-track{background:transparent;}
  }
  .cat-pill{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .cat-pill.active{background:var(--brass); color:#1A1310; border-color:var(--brass);}

  /* ---------- menu items ---------- */
  .item-card{
    display:flex; justify-content:space-between; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .item-card .info{flex:1; min-width:0;}
  .item-card .name{font-weight:600; font-size:15px; margin:0 0 3px 0;}
  .item-card .abv{font-size:11px; color:var(--text-dim); font-weight:500; margin-left:6px;}
  .item-card .diet-tag{
    display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px;
    padding:0 3px; margin-left:5px; border-radius:4px; border:1px solid var(--border);
    font-size:9.5px; font-weight:700; color:var(--brass); vertical-align:1px;
  }
  .item-card .cat-tag{font-size:10.5px; color:var(--brass); text-transform:uppercase; letter-spacing:0.05em;
    margin-left:8px; border:1px solid var(--border); border-radius:4px; padding:1px 6px;}
  .item-card .desc{font-size:12.5px; color:var(--text-dim); line-height:1.4; margin:5px 0 0 0;}
  .item-card .prices{margin-top:7px; display:flex; flex-wrap:wrap; gap:4px 14px;}
  .item-card .price{font-size:13.5px; color:var(--brass); font-weight:600;}
  .item-card .price .lbl{color:var(--text-dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; margin-right:4px;}
  .item-card .add-btn{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--violet-bright);
    background:transparent; color:var(--violet-bright); font-size:19px; align-self:center;
    display:flex; align-items:center; justify-content:center;
  }
  .item-card .add-btn:active{background:var(--violet-bright); color:#fff;}
  .item-card.unavailable{opacity:0.5;}
  .item-card.unavailable .name{text-decoration:line-through;}
  .item-card.unavailable .add-btn{border-color:var(--text-dim); color:var(--text-dim);}
  .unavailable-tag{font-size:10.5px; color:var(--danger); text-transform:uppercase; letter-spacing:0.06em; font-weight:700; margin-left:8px;}
  .empty-state{color:var(--text-dim); font-size:13.5px; padding:20px 0; text-align:center; line-height:1.5;}

  /* ---------- table order bar + sheet ---------- */
  .order-bar{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center;}
  .order-bar-inner{
    width:100%; max-width:640px; margin:0 16px 16px 16px; background:var(--violet-bright);
    border-radius:14px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .order-bar-inner span{font-weight:600; font-size:14px;}
  .order-bar-inner .cta{background:#fff; color:var(--violet-bright); border:none; padding:8px 16px; border-radius:8px; font-weight:700; font-size:13px;}
  .order-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .order-line .oinfo{flex:1; min-width:0;}
  .order-line .oname{font-size:14px; font-weight:600;}
  .order-line .ovariant{font-size:11.5px; color:var(--text-dim);}
  .order-line .oprice{font-size:12.5px; color:var(--brass); margin-top:2px;}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:15px;}
  .qty-ctrl .qnum{width:18px; text-align:center; font-size:14px; font-weight:600;}
  .total-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-family:'Oswald',sans-serif; font-size:17px;}
  .total-row .amt{color:var(--brass);}
  .table-tag{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}

  /* ---------- variant quick-add ---------- */
  .variant-row{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .variant-row button{
    display:flex; justify-content:space-between; padding:12px 14px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
  }
  .variant-row button span:last-child{color:var(--brass);}
  .variant-row button:active{border-color:var(--violet-bright);}

  /* ---------- bar kiosk screen (full-screen iPad-style grid) ---------- */
  .bar-shell{position:fixed; top:0; left:0; right:0; bottom:0; z-index:40; background:var(--bg); display:flex; flex-direction:column;}
  .bar-topbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--border); background:var(--surface);}
  .bar-topbar h1{font-size:19px; margin:0; letter-spacing:0.04em;}
  .bar-topbar .bar-count{color:var(--brass); font-family:'Inter',sans-serif; font-weight:600; letter-spacing:0;}
  .bar-topbar .bar-exit{color:var(--text-dim); font-size:12.5px; text-decoration:underline;}

  /* 4-wide grid; each tile is 1/16 of the screen while <=16 orders are active,
     and rows keep the same square-ish size and simply scroll beyond that. */
  .bar-grid{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(22vh,1fr);
    gap:1px; background:var(--border);
  }
  .bar-tile{
    border:none; background:var(--surface); color:var(--text);
    display:flex; flex-direction:column; position:relative; padding:0; overflow:hidden;
  }
  .bar-tile.fresh{box-shadow:inset 0 0 0 3px var(--brass);}
  .bar-tile .btname{font-family:'Oswald',sans-serif; font-size:clamp(17px,2.6vw,30px); text-transform:uppercase; letter-spacing:0.03em; text-align:center; line-height:1.1; word-break:break-word;}
  .bar-tile .btcount{font-size:11.5px; color:var(--text-dim); text-align:center;}
  .bar-tile .btdot{position:absolute; top:12px; right:12px; width:10px; height:10px; border-radius:50%; background:var(--brass); box-shadow:0 0 8px var(--brass); z-index:1;}
  .bar-tile.empty{background:var(--bg);}
  .bar-tile-info{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; padding:10px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .bar-tile-info:active{background:var(--surface-2);}
  .bar-tile-actions{flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-top:1px solid var(--border);}
  .bar-tile-actions button{
    border:none; background:var(--surface-2); color:var(--text-dim); font-family:'Oswald',sans-serif;
    font-size:clamp(10.5px,1.3vw,13px); letter-spacing:0.03em; text-transform:uppercase; padding:10px 4px; -webkit-tap-highlight-color:transparent;
  }
  .bar-tile-actions button:active{background:var(--surface);}
  .bar-tile-actions .bta-view{color:var(--brass);}
  .bar-tile-actions .bta-clear{color:var(--success);}

  /* drill-down order detail, replaces the grid full-screen */
  .bar-detail-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:20px 22px 12px; max-width:520px; margin:0 auto; width:100%;}
  .bar-line{display:flex; justify-content:space-between; font-size:16px; padding:7px 0; border-bottom:1px solid var(--border);}
  .bar-line .bqty{color:var(--brass); font-weight:700; margin-right:6px;}
  .bar-for{color:var(--violet-bright); font-weight:600; font-size:13px;}
  .bar-notes{font-size:13.5px; color:var(--text-dim); font-style:italic; margin-top:10px;}
  .bar-total{display:flex; justify-content:space-between; font-family:'Oswald',sans-serif; font-size:19px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}
  .bar-print-head{display:none;}
  .bar-detail-actions{flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-top:1px solid var(--border);}
  .bar-action-btn{border:none; padding:20px 10px; font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.04em; text-transform:uppercase;}
  .bar-action-print{background:var(--surface); color:var(--text);}
  .bar-action-clear{background:var(--surface); color:var(--success);}
  .bar-action-return{background:var(--surface); color:var(--text-dim);}
  .bar-action-btn:active{background:var(--surface-2);}

  /* ---------- customer-facing "go to bar" full-screen confirmation ---------- */
  .sent-shell{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg); display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:40px 24px; overflow-y:auto;
  }
  .sent-check{
    width:60px; height:60px; border-radius:50%; border:2px solid var(--success);
    color:var(--success); font-size:30px; display:flex; align-items:center;
    justify-content:center; margin-bottom:22px; flex:0 0 auto;
  }
  .sent-eyebrow{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.14em; color:var(--text-dim); font-size:12.5px; margin:0 0 10px 0;}
  .sent-instruction{font-size:18px; color:var(--text); margin:0 0 22px 0; line-height:1.4; max-width:420px;}
  .sent-groupname{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em;
    font-size:clamp(38px,13vw,76px); line-height:1.05; color:var(--brass);
    margin:0 0 24px 0; overflow-wrap:break-word; max-width:100%;
  }
  .sent-sub{font-size:13px; color:var(--text-dim); margin:0 0 20px 0;}
  .sent-breakdown{width:100%; max-width:380px; margin:0 0 28px 0; text-align:left; border-top:1px solid var(--border); padding-top:14px;}
  .sent-item-line{display:flex; justify-content:space-between; gap:10px; font-size:14.5px; padding:6px 0; color:var(--text); border-bottom:1px solid var(--border);}
  .sent-item-line .sqty{color:var(--brass); font-weight:700;}
  .sent-item-line .sfor{color:var(--violet-bright); font-weight:600; font-size:12.5px;}
  .sent-item-note{font-size:12.5px; color:var(--text-dim); font-style:italic; margin-top:8px;}
  .sent-shell .btn-primary, .sent-shell .btn-ghost{max-width:340px;}

  /* printing an individual order: hide everything else on the page.
     #bar-print-staging holds a ticket built on demand for the grid's quick
     Print button, so a ticket can be printed without opening the drill-down. */
  #bar-print-staging{display:none;}
  @media print{
    #bar-print-staging{display:block;}
    body *{visibility:hidden;}
    .bar-print-area, .bar-print-area *{visibility:visible;}
    .bar-print-area{position:absolute; top:0; left:0; width:100%; padding:0; margin:0; color:#000; background:#fff;}
    .bar-print-area .bar-print-head{display:block; margin-bottom:10px;}
    .bar-print-area .bar-print-title{font-family:'Oswald',sans-serif; font-size:22px; text-transform:uppercase;}
    .bar-print-area .bar-print-time{font-size:12px; color:#444;}
    .bar-print-area .bar-line, .bar-print-area .bar-total{color:#000; border-color:#999;}
    .bar-print-area .bqty{color:#000;}
  }

  /* ---------- sheet / modal ---------- */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:640px; margin:0 auto; background:var(--surface);
    border-radius:18px 18px 0 0; padding:20px 18px 24px 18px;
    max-height:85vh; overflow-y:auto; border-top:1px solid var(--border);
  }
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px auto;}
  .onboard-overlay{
    position:fixed; inset:0; z-index:55; background:var(--bg);
    display:flex; flex-direction:column; justify-content:center;
    padding:40px 26px; overflow-y:auto; max-width:640px; margin:0 auto;
  }
  .onboard-mark{font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--brass); margin-bottom:10px;}
  .onboard-overlay h2{font-size:28px; letter-spacing:0.5px; margin:0 0 26px 0; color:var(--text);}
  .onboard-overlay p{font-size:16px; line-height:1.55; color:var(--text); margin:0 0 18px 0;}
  .onboard-overlay p strong{color:var(--brass);}
.onboard-overlay .onboard-note{color:var(--text-dim); font-size:14px;}
  .onboard-overlay .btn-primary{margin-top:18px;}
  .members-banner{
    position:relative; isolation:isolate; overflow:hidden; min-height:132px; box-sizing:border-box;
    width:100%; padding:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(122px,42%);
    align-items:stretch; text-align:left; border:1px solid rgba(150,189,13,0.72); border-radius:4px;
    background:
      radial-gradient(circle at 15% 0%, rgba(102,45,145,0.5), transparent 52%),
      linear-gradient(120deg, #17101D 0%, #130A1A 58%, #08070A 100%);
    box-shadow:inset 4px 0 0 var(--site-green), 0 10px 28px rgba(0,0,0,0.28);
    margin-bottom:4px; margin-top:0;
  }
  .members-banner::before{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:0.28;
    background:repeating-linear-gradient(-13deg, transparent 0 12px, rgba(255,255,255,0.035) 12px 13px);
  }
  .members-banner .mb-text{min-width:0; align-self:center; padding:17px 4px 17px 18px;}
  .members-banner .mb-kicker{
    display:block; margin-bottom:5px; color:var(--site-green); font-family:'gamay-narrow','Oswald',sans-serif;
    font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase;
  }
  .members-banner .mb-title{
    display:block; max-width:230px; color:#F3F0F4; font-family:'modesto-poster',Georgia,serif;
    font-size:22px; font-weight:400; line-height:0.98; letter-spacing:0.01em;
  }
  .members-banner .mb-price{
    display:block; margin-top:7px; color:var(--site-green); font-family:'gamay-narrow','Oswald',sans-serif;
    font-size:16px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
  }
  .members-banner .mb-sub{
    display:block; max-width:190px; margin-top:5px; color:#C9C0C9; font-size:10.5px; line-height:1.35;
  }
  .mb-card-visual{
    position:relative; min-width:0; display:flex; align-items:center; justify-content:center;
    padding:12px 7px 12px 0;
    background:linear-gradient(100deg, transparent, rgba(102,45,145,0.24));
  }
  .mb-card-img{
    display:block; width:calc(100% + 18px); max-width:176px; height:auto; margin-right:-13px;
    transform:rotate(-4deg); transform-origin:center; border-radius:7px;
    box-shadow:0 8px 22px rgba(0,0,0,0.62); filter:saturate(1.06) contrast(1.04);
  }
  @media (max-width:370px){
    .members-banner{grid-template-columns:minmax(0,1fr) 116px;}
    .members-banner .mb-title{font-size:19px;}
    .members-banner .mb-sub{font-size:10px;}
  }
  .members-banner-solo{grid-template-columns:minmax(0,1fr);}
  .members-banner-solo .mb-text{padding:17px 18px;}
  @media (max-width:370px){
    .members-banner-solo{grid-template-columns:minmax(0,1fr);}
  }
  .mem-highlight{background:rgba(201,161,90,0.09); margin:0 -16px; padding-left:16px; padding-right:16px; border-radius:8px;}
  .member-badge{display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--brass); border:1px solid var(--brass); border-radius:4px; padding:1px 5px; margin-left:7px; vertical-align:middle;}
  .member-group-heading{font-size:13px; color:var(--brass); text-transform:uppercase; letter-spacing:0.08em;
    margin:22px 0 6px 0; padding-bottom:6px; border-bottom:1px solid var(--border);}
  .member-group-heading:first-of-type{margin-top:10px;}
  .field-label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin:16px 0 6px 0; display:block;}
  .field-label:first-of-type{margin-top:0;}
  .price-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-primary{
    width:100%; margin-top:14px; padding:14px; border:none; border-radius:10px;
    background:var(--violet-bright); color:#fff; font-family:'Oswald',sans-serif; font-size:15px;
    letter-spacing:0.05em; text-transform:uppercase;
  }
  .btn-secondary{
    width:100%; margin-top:10px; padding:12px; border:1px solid var(--border); border-radius:10px;
    background:transparent; color:var(--text-dim); font-size:13.5px;
  }
  .join-name-input{
    border:2px solid rgba(255,255,255,0.94) !important;
    background:#171218 !important;
    color:#F3EEF2 !important;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.03), 0 0 16px rgba(91,42,115,0.14);
  }
  .join-name-input::placeholder{color:#A99FA8;}
  .join-name-input:focus{
    outline:none;
    border-color:#FFFFFF !important;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08), 0 0 18px rgba(123,67,148,0.28);
  }
  .join-sheet-or{
    font-size:12px; color:var(--text-dim); text-align:center; margin:16px 0 4px 0;
    letter-spacing:0.06em;
  }
  .join-code-btn{
    border:1.5px solid #B5294F !important;
    background:rgba(91,42,115,0.14) !important;
    color:#EEE8EC !important;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.02), 0 0 16px rgba(91,42,115,0.16);
  }
  .join-code-btn:active{
    background:rgba(91,42,115,0.22) !important;
  }
  .join-code-btn[disabled]{
    opacity:0.75;
  }
  .btn-danger{
    width:100%; margin-top:10px; padding:11px; border:1px solid var(--danger); border-radius:10px;
    background:transparent; color:var(--danger); font-size:13px; font-weight:600;
  }
  .btn-ghost{background:transparent; border:none; color:var(--text-dim); font-size:13px; text-decoration:underline; width:100%; text-align:center; margin-top:14px; padding:6px 0;}

  /* ---------- pin gate ---------- */
  .pin-wrap{display:flex; flex-direction:column; align-items:center; padding:60px 20px 20px 20px; text-align:center;}
  .pin-wrap p{color:var(--text-dim); font-size:13.5px; max-width:280px; margin:6px 0 22px 0;}
  .pin-dots{display:flex; gap:12px; margin-bottom:22px;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--brass); background:transparent;}
  .pin-dot.filled{background:var(--brass);}
  .pin-pad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
  .pin-pad button{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:20px; font-weight:600;
  }
  .pin-pad button:active{background:var(--surface-2);}
  .pin-pad .clear{color:var(--danger); font-size:13px;}

  /* ---------- menu editor ---------- */
  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .cat-block{margin-bottom:22px;}
  .cat-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .cat-block-head h3{font-size:14.5px; margin:0; color:var(--brass);}
  .cat-block-head .del-cat{color:var(--danger); font-size:11.5px; background:none; border:none; text-decoration:underline;}
  .edit-item-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); gap:10px;}
  .edit-item-row .ei-name{font-size:13.5px; font-weight:600;}
  .edit-item-row .ei-price{font-size:12px; color:var(--brass);}
  .edit-item-row .ei-actions{display:flex; gap:10px; flex:0 0 auto;}
  .edit-item-row .ei-actions button{background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline;}
  .btn-small{padding:9px 14px; border-radius:8px; border:1px solid var(--brass); background:transparent; color:var(--brass); font-size:12.5px; font-weight:600;}
  .new-cat-row{display:flex; gap:8px; margin-top:6px;}
  .new-cat-row input{flex:1;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text-dim);}
  .checkbox-row input{width:auto;}

  /* ---------- Spirit Wheel ---------- */
  .spirit-wheel-sheet{padding-top:14px;}
  .spirit-wheel-head{text-align:center; margin:0 0 8px 0;}
  .spirit-wheel-head h2{
    margin:0; font-family:'modesto-poster','Oswald',serif; font-size:25px; font-weight:400;
    letter-spacing:0.025em; text-transform:uppercase; color:#F2EEF1;
  }
  .spirit-wheel-head p{
    margin:5px 0 0; color:#B9AFB8; font-family:'gamay-narrow','Oswald',sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
  }
  .wheel-cat-row{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); margin:0 0 7px 0;
    border-bottom:1px solid var(--border);
  }
  .wheel-cat-row button{
    background:transparent; border:0; border-bottom:2px solid transparent; color:#746A73;
    font-family:'gamay-narrow','Oswald',sans-serif; font-weight:600; font-size:12.5px;
    letter-spacing:0.10em; text-transform:uppercase; padding:9px 8px;
  }
  .wheel-cat-row button.active{color:#F0EAF0; border-bottom-color:#8C1F3D;}
  .spirit-wheel-stage{
    position:relative; width:min(100%, 460px); aspect-ratio:1; margin:0 auto;
  }
  .spirit-wheel-canvas{
    display:block; width:100%; height:100%; touch-action:none; cursor:grab;
  }
  .spirit-wheel-canvas:active{cursor:grabbing;}
  .spirit-wheel-pointer{
    position:absolute; z-index:4; left:-1px; top:50%; transform:translateY(-50%);
    width:0; height:0; border-top:15px solid transparent; border-bottom:15px solid transparent;
    border-left:32px solid #8C1F3D; pointer-events:none;
    filter:drop-shadow(2px 0 2px rgba(0,0,0,0.65));
  }
  .spirit-wheel-centre{
    position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%);
    width:24%; aspect-ratio:1; border-radius:50%; border:2px solid #8C1F3D;
    background:#080708; color:#EEE8EC; text-transform:uppercase; line-height:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px;
  }
  .spirit-wheel-centre .the{
    display:block; color:#A89DA6; font-size:9px; font-weight:600; letter-spacing:0.13em; margin-bottom:3px;
  }
  .spirit-wheel-centre .spirit{
    display:block; font-family:'modesto-poster','Oswald',serif; font-size:clamp(12px,3.7vw,18px);
    font-weight:400; line-height:0.98; letter-spacing:0.01em;
  }
  .spirit-wheel-result{
    min-height:86px; margin-top:2px; padding:13px 6px 0; border-top:1px solid var(--border); text-align:center;
  }
  .spirit-wheel-result .result-kicker{
    color:#B5294F; font-family:'gamay-narrow','Oswald',sans-serif; font-size:9.5px;
    font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
  }
  .spirit-wheel-result .result-name{
    margin-top:5px; color:#F2EDF0; font-family:'modesto-poster','Oswald',serif;
    font-size:24px; line-height:1.02; text-transform:uppercase;
  }
  .spirit-wheel-result .result-desc{
    max-width:430px; margin:6px auto 0; color:var(--text-dim); font-size:11.5px; line-height:1.35;
  }
  .spirit-wheel-result .result-price{
    margin-top:5px; color:#C8BFC7; font-size:14px; font-weight:700;
  }
  .spirit-wheel-actions{margin-top:10px;}
  .spirit-wheel-actions[hidden], .spirit-wheel-waiting[hidden]{display:none !important;}
  .spirit-wheel-sheet .field-label{margin-top:12px;}
  .spirit-wheel-name-input{
    border:1.5px solid rgba(255,255,255,0.92) !important;
    background:#111013 !important;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .spirit-wheel-name-input:focus{
    outline:none;
    border-color:#fff !important;
    box-shadow:0 0 0 2px rgba(91,42,115,0.28);
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--success); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  footer{text-align:center; padding:0 16px 24px 16px; font-size:11px; color:var(--text-dim);}

  /* ---------- staff footer (Liqueurs tab only) ---------- */
  .staff-footer{padding:10px 16px 24px 16px;}
  .staff-footer-label{font-size:11px; color:var(--text-dim); margin:0 0 8px 0; text-transform:uppercase; letter-spacing:0.06em;}
  .staff-footer-actions{display:flex; gap:8px;}
  .staff-btn{
    flex:1; padding:11px 6px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); font-size:12.5px; font-weight:600;
  }
  .staff-btn.active{border-color:var(--brass); color:var(--brass);}
  .staff-lock-btn{background:none; border:none; color:var(--text-dim); font-size:11px; text-decoration:underline; padding:10px 0 0 0; width:100%; text-align:center;}

  /* ---------- 86 list rows ---------- */
  .eightysix-row{
    display:flex; justify-content:space-between; align-items:center; padding:11px 0;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .eightysix-row .e86-name{font-size:13.5px; font-weight:600;}
  .eightysix-row .e86-status{font-size:11.5px; color:var(--success);}
  .eightysix-row.is-out .e86-name{color:var(--text-dim); text-decoration:line-through;}
  .eightysix-row.is-out .e86-status{color:var(--danger);}


  /* ============================================================
     BLACK ROSE FINAL VISUAL PASS
     Mirrors the approved black / burgundy / antique-gold mockup.
     No additional artwork or icon assets are introduced.
     ============================================================ */
  :root{
    --bg:#000000;
    --surface:#090707;
    --surface-2:#0D0A0B;
    --violet:#651126;
    --violet-bright:#8F1835;
    --brass:#C99B45;
    --text:#F3F0EE;
    --text-dim:#B9B1AE;
    --border:#302629;
    --site-purple:#651126;
    --site-green:#C99B45;
    --saw-red:#B21F45;
  }

  body{
    background:#000;
    color:var(--text);
  }

  #app{
    background:#000;
  }

  header.topbar{
    position:relative;
    top:auto;
    padding:4px 14px 0;
    background:#000;
  }

  .brand{
    margin:0 0 10px;
  }

  .brand-mark{
    margin:0 auto;
    padding:0;
  }

  .brand-logo{
    width:min(430px, 96vw);
    max-height:170px;
    object-fit:contain;
    margin:0 auto;
    mix-blend-mode:normal;
    filter:contrast(1.04) saturate(1.04);
  }

  main{
    padding:2px 14px 68px;
  }

  .toolbar{
    gap:10px;
    margin-bottom:12px;
  }

  /* Membership card */
  .members-banner{
    min-height:150px;
    grid-template-columns:minmax(0,1fr) minmax(132px,43%);
    border:1px solid rgba(201,155,69,.92);
    border-radius:8px;
    background:
      radial-gradient(circle at 18% 12%, rgba(91,12,30,.30), transparent 52%),
      linear-gradient(120deg,#090707 0%,#0D090A 54%,#030303 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.015),
      0 8px 24px rgba(0,0,0,.40);
    margin:0;
  }

  .members-banner::before{
    opacity:.18;
    background:repeating-linear-gradient(-14deg,transparent 0 15px,rgba(255,255,255,.028) 15px 16px);
  }

  .members-banner .mb-text{
    padding:18px 6px 18px 20px;
  }

  .members-banner .mb-kicker{
    color:var(--brass);
    font-size:11px;
    letter-spacing:.18em;
    margin-bottom:8px;
  }

  .members-banner .mb-title{
    max-width:255px;
    color:#F4F1EF;
    font-size:24px;
    line-height:1.02;
  }

  .members-banner .mb-price{
    color:var(--brass);
    font-size:18px;
    letter-spacing:.06em;
    margin-top:10px;
  }

  .members-banner .mb-sub{
    max-width:215px;
    color:#D0C9C6;
    font-size:11.5px;
    line-height:1.45;
    margin-top:7px;
  }

  .mb-card-visual{
    padding:14px 8px 14px 0;
    background:linear-gradient(100deg,transparent,rgba(92,13,31,.14));
  }

  .mb-card-img{
    width:calc(100% + 20px);
    max-width:188px;
    margin-right:-14px;
    transform:rotate(-4deg);
    border-radius:8px;
    box-shadow:0 10px 26px rgba(0,0,0,.72);
    filter:saturate(1.02) contrast(1.06) brightness(.94);
  }

  /* Feature buttons */
  .spin-cta{
    min-height:62px;
    padding:12px 16px;
    border:1px solid rgba(181,31,70,.95);
    border-radius:6px;
    background:
      linear-gradient(90deg,rgba(97,9,29,.52) 0 5px,transparent 5px),
      radial-gradient(circle at 18% 50%,rgba(99,11,30,.26),transparent 52%),
      linear-gradient(105deg,#080606,#12090B 65%,#1D080D);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.012);
  }

  .spin-title{
    font-size:17px;
    font-weight:600;
    letter-spacing:.095em;
  }

  .spin-arrow{
    color:#C43758;
    font-size:28px;
  }

  .group-order-hero{
    min-height:72px;
    padding:14px 16px;
    border:1px solid rgba(201,155,69,.92);
    border-radius:6px;
    background:
      radial-gradient(circle at 50% 50%,rgba(92,13,31,.28),transparent 58%),
      linear-gradient(110deg,#070606 0%,#12090B 50%,#080606 100%);
    box-shadow:inset 0 0 18px rgba(201,155,69,.025);
  }

  .group-order-hero:active{
    background:#170A0D;
  }

  .group-order-hero .group-title{
    color:var(--brass);
    font-size:18px;
    letter-spacing:.105em;
  }

  .group-order-hero .group-sub{
    color:#D0C8C6;
    font-size:11px;
    letter-spacing:.10em;
  }

  /* Search */
  #search-input{
    min-height:58px;
    padding:14px 16px;
    border:1px solid rgba(201,155,69,.70);
    border-radius:8px;
    background:linear-gradient(105deg,#080808,#0C090A);
    color:#F3F0EE;
    font-size:16px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.018);
  }

  #search-input::placeholder{
    color:#AFA8A5;
  }

  #search-input:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 2px rgba(201,155,69,.12);
  }

  /* Main tabs */
  .group-toggle{
    min-height:58px;
    padding:0;
    border:1px solid #33292B;
    border-radius:8px;
    background:linear-gradient(180deg,#0E0B0C,#090708);
    overflow:hidden;
    margin-bottom:12px;
  }

  .group-toggle-btn{
    padding:13px 8px;
    border-radius:0;
    border-right:1px solid #33292B;
    color:#C9C2BF;
    font-size:14px;
    letter-spacing:.075em;
  }

  .group-toggle-btn:last-child{
    border-right:0;
  }

  .group-toggle-btn.active{
    background:linear-gradient(110deg,#641126,#8E1834 55%,#641126);
    color:#FFF;
    box-shadow:inset 0 0 0 1px rgba(201,155,69,.72);
  }

  /* Category pills */
  .cat-scroll{
    gap:9px;
    padding:0 0 16px;
  }

  .cat-pill{
    padding:10px 17px;
    border:1px solid #3A3032;
    background:linear-gradient(180deg,#0F0C0D,#090708);
    color:#D0C9C6;
    font-size:14px;
    font-weight:500;
  }

  .cat-pill.active{
    background:linear-gradient(110deg,#D9AE5B,#B98534);
    color:#17100A;
    border-color:#D6A84F;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
  }

  /* Menu list */
  .item-card{
    padding:16px 0;
    border-bottom:1px solid #241D1F;
    gap:14px;
  }

  .item-card .name{
    font-size:16px;
    font-weight:600;
    color:#F4F1EF;
    margin-bottom:4px;
  }

  .item-card .prices{
    margin-top:8px;
    gap:5px 18px;
  }

  .item-card .price{
    color:#D1A24A;
    font-size:14px;
  }

  .item-card .price .lbl{
    color:#AFA7A4;
    font-size:11.5px;
    letter-spacing:.055em;
  }

  .item-card .add-btn{
    width:42px;
    height:42px;
    border:1px solid #B5264D;
    background:linear-gradient(145deg,rgba(112,18,43,.72),rgba(48,7,18,.65));
    color:#FFF;
    font-size:23px;
    box-shadow:inset 0 0 12px rgba(181,38,77,.10);
  }

  .item-card .add-btn:active{
    background:#8F1835;
    color:#FFF;

  /* Order bar and modal surfaces follow the same palette */

function mergeMenus(fresh, old){
  if(!old) return fresh;
  const oldByPlu = {};
  const oldCatById = {};
  old.categories.forEach(c=>{
    oldCatById[c.id] = c;
    c.items.forEach(it=>{ if(it.plu) oldByPlu[it.plu] = it; });
  });
  const usedOldIds = new Set();
  const merged = { categories: fresh.categories.map(freshCat=>{
    const oldCat = oldCatById[freshCat.id];
    const items = freshCat.items.map(freshItem=>{
      const oldItem = freshItem.plu ? oldByPlu[freshItem.plu] : null;
      if(oldItem && oldItem.edited){
        usedOldIds.add(oldItem.id);
        // Staff edit wins on name/desc/abv/prices; new code-only fields
        // (extraOption, sideChoice, iceOptional) still get backfilled since
        // there's no UI for staff to have set those themselves.
        const result = { ...oldItem };
        ['extraOption','sideChoice','iceOptional'].forEach(k=>{
          if(freshItem[k] !== undefined && result[k] === undefined) result[k] = freshItem[k];
        });
        return result;
      }
      if(oldItem) usedOldIds.add(oldItem.id);
      return freshItem;
    });
    // Staff-added items have no plu, so they never match a fresh item —
    // carry them across into the same category id if it still exists.
    if(oldCat){
      oldCat.items.forEach(oi=>{ if(!oi.plu && !usedOldIds.has(oi.id)){ items.push(oi); usedOldIds.add(oi.id); } });
      if(oldCat.hiddenGroups) freshCat.hiddenGroups = oldCat.hiddenGroups;
    }
    return { ...freshCat, items };
  }) };
  // Whole categories staff added that don't exist in code at all.
  old.categories.forEach(oldCat=>{
    if(!merged.categories.find(c=>c.id===oldCat.id) && oldCat.items.some(it=>!it.plu)){
      merged.categories.push(oldCat);
    }
  });
  return merged;
}
async function loadAll(){
  try{
    const snap = await menuDocRef.get();
    if(snap.exists && snap.data().version === MENU_VERSION){ menu = JSON.parse(snap.data().json); }
    else {
      const old = snap.exists ? JSON.parse(snap.data().json) : null;
      menu = mergeMenus(defaultMenu(), old);
      await menuDocRef.set({ json: JSON.stringify(menu), updatedAt: Date.now(), version: MENU_VERSION });
    }
  }catch(e){ console.error(e); menu = defaultMenu(); }
  if(!activeCat && menu.categories.length){ activeCat = menu.categories[0].id; }
  loaded = true;
  if(typeof location!=='undefined' && location.hash==='#bar'){
    location.hash = '';
    openStaffArea('bar');
  }
  render();
  checkMembersCardImage();
  checkLogoImage();
  menuDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const incoming = snap.data().json;
    if(incoming !== JSON.stringify(menu)){ menu = JSON.parse(incoming); render(); }
  });
}
async function saveMenu(msg){
  try{
    await menuDocRef.set({ json: JSON.stringify(menu), updatedAt: Date.now(), version: MENU_VERSION });
    showToast(msg||'Saved');
    backupMenu(msg);
  }
  catch(e){ console.error(e); showToast('Could not save — check connection'); }
}

// Best-effort snapshot after every successful save. Never blocks or fails
// the actual save above — if a backup write fails, the live menu is still
// safe, we just miss one restore point.
async function backupMenu(label){
  try{
    await backupsCollectionRef.doc(String(Date.now())).set({
      json: JSON.stringify(menu), savedAt: Date.now(), label: label || 'Save'
    });
    pruneOldBackups();
  }catch(e){}
}
async function pruneOldBackups(){
  try{
    const snap = await backupsCollectionRef.orderBy('savedAt','desc').get();
    const extra = snap.docs.slice(MAX_BACKUPS);
    await Promise.all(extra.map(d=>d.ref.delete()));
  }catch(e){}
}

  }catch(e){ backupsList = []; }

function fmtBackupTime(ts){
  return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
async function restoreBackup(id){
  const b = backupsList.find(x=>x.id===id);
  if(!b) return;
  const when = fmtBackupTime(b.savedAt);
  if(!confirm('Restore the menu to the backup from '+when+'? This overwrites everything currently on the menu.')) return;
  try{
    menu = JSON.parse(b.json);
    backupsPanelOpen = false;
    await saveMenu('Restored from backup ('+when+')');
  }catch(e){ showToast('Restore failed — check connection'); }
}

async function persistTableOrder(){
  if(!tableSlug || !tableOrder) return;

}

function startTablePolling(){
  stopTablePolling();
  tablePollId = ordersCollectionRef.doc(tableSlug).onSnapshot(snap=>{
    if(!snap.exists) return;
    const fresh = snap.data();
    if(JSON.stringify(fresh)!==JSON.stringify(tableOrder)){ tableOrder = fresh; render(); }
  });
}
function stopTablePolling(){ if(tablePollId){ tablePollId(); tablePollId=null; } }

function startBarPolling(){
  stopBarPolling();
  barPollId = ordersCollectionRef.onSnapshot(snap=>{
    const out = [];
    // The bar should only ever see orders the customer has actually sent —
    // in-progress carts stay private until "Send to Bar" is confirmed.
    snap.forEach(doc=>{ const d = doc.data(); if(d.sent) out.push(d); });
    out.sort((a,b)=> (a.sentAt||a.updatedAt||0)-(b.sentAt||b.updatedAt||0));
    barOrders = out;
    render();
  });
}
function stopBarPolling(){ if(barPollId){ barPollId(); barPollId=null; } }

function syncNewMenuItems(silent){
  const fresh = defaultMenu();
  const freshByPlu = {};
  fresh.categories.forEach(fc=> fc.items.forEach(fi=>{ if(fi.plu) freshByPlu[fi.plu] = fi; }));

  const existingPlus = new Set();
  menu.categories.forEach(cat=> cat.items.forEach(it=>{ if(it.plu) existingPlus.add(it.plu); }));
  let added = 0;
  fresh.categories.forEach(freshCat=>{
    freshCat.items.forEach(freshItem=>{
      if(freshItem.plu && existingPlus.has(freshItem.plu)) return; // already on the menu, leave it alone
      let cat = menu.categories.find(c=>c.id===freshCat.id);
      if(!cat){
        cat = { id: freshCat.id, name: freshCat.name, items: [] };
        if(freshCat.wheel) cat.wheel = true;
        if(freshCat.mixable) cat.mixable = true;
        if(freshCat.hiddenGroups) cat.hiddenGroups = [...freshCat.hiddenGroups];
        menu.categories.push(cat);
      }
      cat.items.push(freshItem);
      if(freshItem.plu) existingPlus.add(freshItem.plu);
      added++;
    });
  });
  // Repair pass: force every plu-backed item's id to the deterministic
  // catId+plu form. Older builds assigned ids from a counter that reset on
  // every menu rebuild, so a new item could silently land on the exact same
  // id as an unrelated older one — tapping "+" would then add whichever
  // item that id pointed to first, not the one actually tapped. This can't
  // recur once ids are plu-based, and this pass fixes any item still
  // carrying an old colliding id from before this fix existed.
  let fixed = 0;
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.plu){
        const correctId = cat.id+'-'+item.plu;
        if(item.id !== correctId){ item.id = correctId; fixed++; }
      }
    });
  });
  // Fill in any blank ABV on existing items from the latest menu code —
  // only ever fills a blank, never overwrites a value already set, so it
  // can't stomp on a deliberate edit.
  let abvFilled = 0;
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.plu && !item.abv){
        const fi = freshByPlu[item.plu];
        if(fi && fi.abv){ item.abv = fi.abv; abvFilled++; }
      }
    });
  });
  // Backfill member-tab metadata (memberGroup, isMember, isMembershipCard,
  // hiddenGroups) on items/categories that already existed before this
  // grouping was added — same reasoning as the ABV fill above: items that
  // already exist by plu are never touched by the "add new items" pass, so
  // a purely structural field like this needs its own explicit backfill or
  // it silently never arrives on a menu that's already been synced once.
  let memberMetaFixed = 0;
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      const fi = item.plu ? freshByPlu[item.plu] : null;
      if(!fi) return;
      let changed = false;
      if(fi.memberGroup && item.memberGroup !== fi.memberGroup){ item.memberGroup = fi.memberGroup; changed = true; }
      if(fi.isMember && !item.isMember){ item.isMember = true; changed = true; }
      if(fi.isMembershipCard && !item.isMembershipCard){ item.isMembershipCard = true; changed = true; }
      if(changed) memberMetaFixed++;
    });
    if(cat.id==='members' && !Array.isArray(cat.hiddenGroups)){ cat.hiddenGroups = []; }
  });
  if(added>0 || fixed>0 || abvFilled>0 || memberMetaFixed>0){
    const parts = [];
    if(added>0) parts.push(added+' new item'+(added===1?'':'s')+' added');
    if(fixed>0) parts.push(fixed+' item link'+(fixed===1?'':'s')+' repaired');
    if(abvFilled>0) parts.push(abvFilled+' ABV'+(abvFilled===1?'':'s')+' filled in');
    if(memberMetaFixed>0) parts.push(memberMetaFixed+' item'+(memberMetaFixed===1?'':'s')+' regrouped');
    saveMenu(parts.join(', '));
  } else if(!silent){ showToast('Menu already up to date'); render(); }
}

function requestAdd(item, forName){
  if(is86(item)){ showToast(item.name+' is currently unavailable'); return; }
  if(!tableSlug){ pendingAddName = forName||''; openJoin(item); return; }
  if(item.isMember && !item.isMembershipCard && !tableOrderHasCard()){
    memberPromptItem = item; memberPromptName = forName||''; memberPromptOpen = true; render(); return;
  }
  proceedToAdd(item, forName);
}
function proceedToAdd(item, forName){
  if(item.prices.length<=1){
    if(item.iceOptional){ icePromptItem=item; icePromptPrice=item.prices[0]; icePromptName=forName||''; icePromptOpen=true; render(); return; }
    if(item.sideChoice){ choicePromptItem=item; choicePromptPrice=item.prices[0]; choicePromptName=forName||''; choicePromptOpen=true; render(); return; }
    addToOrder(item, item.prices[0], forName); return;
  }
  quickAddItem = item; quickAddName = forName||''; render();
}

function addToOrder(item, priceObj, forName, ice, side){
  forName = (forName||'').trim();
  if(!tableOrder){ tableOrder = { slug: tableSlug, displayLabel: tableLabel, items: [], notes: '', updatedAt: Date.now(), sent: false, sentAt: null }; }
  const lineKey = item.id+'::'+priceObj.label+(forName?'::'+forName.toLowerCase():'')+(ice?'::'+ice:'')+(side?'::'+side:'');
  const existing = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(existing){ existing.qty += 1; }
  else{
    tableOrder.items.push({ lineKey, itemId:item.id, name:item.name,
      variant: priceObj.label!=='Price' ? priceObj.label : '', price:priceObj.value, qty:1, forName, ice: ice||'', side: side||'',
      isMember: !!item.isMember, isMembershipCard: !!item.isMembershipCard });
  }
  tableOrder.updatedAt = Date.now();
  persistTableOrder();
  const cat = menu.categories.find(c=>c.items.includes(item));
  if(cat && cat.mixable){
    dashPromptItem = item; dashPromptOpen = true; render();
  } else if(item.extraOption){
    extraPromptItem = item; extraPromptOpen = true; render();
  } else {
    render();
    showToast('Added to '+tableLabel);
  }
}
function skipExtra(){ extraPromptOpen=false; extraPromptItem=null; showToast('Added to '+tableLabel); render(); }
function addExtra(){
  const item = extraPromptItem; const opt = item ? item.extraOption : null;
  extraPromptOpen=false; extraPromptItem=null;
  if(!opt) { render(); return; }
  const lineKey = 'extra::'+opt.plu+'::for::'+item.id;
  const existing = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(existing){ existing.qty += 1; }
  else{
    tableOrder.items.push({ lineKey, itemId:opt.plu, name:opt.name+' – '+item.name, variant:'', price:opt.price, qty:1 });
  }
  tableOrder.updatedAt = Date.now();
  persistTableOrder();
  showToast('Added to '+tableLabel);
  render();
}

function addDash(plu, name){
  const lineKey = 'dash::'+plu;
  const existing = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(existing){ existing.qty += 1; }
  else{
    tableOrder.items.push({ lineKey, itemId:plu, name:'Dash – '+name, variant:'', price:DASH_PRICE, qty:1 });

  tableOrder.updatedAt = Date.now();

}
function changeOrderQty(lineKey, delta){
  if(!tableOrder) return;
  const line = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0){ tableOrder.items = tableOrder.items.filter(l=>l.lineKey!==lineKey); }
  tableOrder.updatedAt = Date.now();
  persistTableOrder(); render();
}

async function confirmSendOrder(){
  if(!tableOrder || !tableOrder.items.length) return;
  const sentAt = Date.now();
  // Each send becomes its own independent ticket (its own doc, its own id) —
  // so if the customer orders a second round before the bar has cleared the
  // first, the new round can't ever overwrite/clobber the one already in progress.
  const ticketId = tableSlug + '__' + sentAt;
  const ticket = { ...tableOrder, slug: ticketId, sent: true, sentAt, updatedAt: sentAt };
  try{
    await ordersCollectionRef.doc(ticketId).set(ticket);
  }catch(e){
    showToast('Could not send — check connection');
    return;
  }
  lastSentSnapshot = {
    displayLabel: tableOrder.displayLabel,
    items: tableOrder.items,
    notes: tableOrder.notes,
    total: orderTotal()
  };
  // Clear the customer's own cart so it can't be sent again by mistake —
  // a fresh, empty draft starts here for any next round.
  tableOrder.items = [];
  tableOrder.notes = '';
  tableOrder.sent = false;
  tableOrder.sentAt = null;
  tableOrder.updatedAt = Date.now();
  persistTableOrder();
  sendConfirmOpen = false;
  orderSheetOpen = false;
  sentScreenOpen = true;
  render();
}

  tableOrder.items = [];

}

function buildTicketHtml(o){

  let lines = '';
  o.items.forEach(l=>{
    lines += `<div class="bar-line ${l.isMember?'mem-highlight':''}"><span><span class="bqty">${l.qty}×</span>${escapeHtml(l.name)}${l.isMember?'<span class="member-badge">Member</span>':''}${l.variant?' — '+escapeHtml(l.variant):''}${l.ice?' — '+escapeHtml(l.ice):''}${l.side?' — '+escapeHtml(l.side):''}${l.forName?' <span class="bar-for">for '+escapeHtml(l.forName)+'</span>':''}</span><span>${money(l.price*l.qty)}</span></div>`;
  });
  return `<div class="bar-print-area">
    <div class="bar-print-head">
      <div class="bar-print-title">${escapeHtml(o.displayLabel)}</div>
      <div class="bar-print-time">${new Date(sentTs).toLocaleString('en-GB')}</div>
    </div>
    ${lines}
    ${o.notes ? `<div class="bar-notes">Note: ${escapeHtml(o.notes)}</div>` : ''}
    <div class="bar-total"><span>Total</span><span>${money(total)}</span></div>
  </div>`;
}
// Prints straight from a grid tile, without opening the drill-down first —
// builds the ticket into a hidden staging node (kept outside #app so it
// survives re-renders) and prints just that.
function quickPrintOrder(slug){
  const o = findBarOrder(slug);

function fmtElapsed(ts){
  const mins = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(mins<1) return 'just now';
  if(mins===1) return '1 min ago';
  if(mins<60) return mins+' min ago';
  const hrs = Math.round(mins/60);
  return hrs+'h ago';
}

function wheelMoneyLine(item){

function spiritWheelSelectedIndex(){
  const items=wheelItems();
  if(!items.length) return null;
  const TAU=Math.PI*2;
  const pointerAngle=Math.PI; // 9 o'clock
  const slice=TAU/items.length;
  const base=pointerAngle-slice/2;
  let local=(pointerAngle-base-wheelRotation)%TAU;
  if(local<0) local+=TAU;
  return Math.floor(local/slice)%items.length;
}


function spiritWheelTickIndex(){
  const items=wheelItems();
  if(!items.length) return null;
  const TAU=Math.PI*2;
  const pointerAngle=Math.PI;
  const slice=TAU/items.length;
  const base=pointerAngle-slice/2;
  let local=(pointerAngle-base-wheelRotation)%TAU;
  if(local<0) local+=TAU;
  return Math.floor(local/slice)%items.length;
}

function spiritWheelHapticTick(force){
  if(!('vibrate' in navigator)) return;
  const now=performance.now();
  const minGap = force < 0.02 ? 110 : force < 0.05 ? 70 : 42;
  if(now-wheelLastHapticAt < minGap) return;
  wheelLastHapticAt=now;
  const duration = force < 0.02 ? 7 : force < 0.05 ? 10 : 13;
  try{ navigator.vibrate(duration); }catch(e){}
}

function maybeSpiritWheelTick(){
  const tickIndex=spiritWheelTickIndex();
  if(tickIndex==null) return;
  if(wheelLastTickIndex===null){
    wheelLastTickIndex=tickIndex;
    return;
  }
  if(tickIndex!==wheelLastTickIndex){
    wheelLastTickIndex=tickIndex;
    spiritWheelHapticTick(Math.abs(wheelVelocity));
  }
}

function drawSpiritWheel(){
  const canvas=document.getElementById('spirit-wheel-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const items=wheelItems();
  if(!items.length) return;

  const TAU=Math.PI*2;
  const pointerAngle=Math.PI;
  const cx=360, cy=360, radius=329;
  const slice=TAU/items.length;
  const base=pointerAngle-slice/2;

  ctx.clearRect(0,0,720,720);

  function wrapText(value,x,y,maxWidth,lineHeight){
    const words=String(value||'').toUpperCase().split(/\s+/);
    const lines=[]; let line='';
    words.forEach(word=>{
      const test=line ? line+' '+word : word;
      if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=word; }
      else line=test;
    });
    if(line) lines.push(line);
    const shown=lines.slice(0,3);
    const startY=y-((shown.length-1)*lineHeight)/2;
    shown.forEach((ln,i)=>ctx.fillText(ln,x,startY+i*lineHeight));
  }

  items.forEach((item,i)=>{
    const start=base+wheelRotation+i*slice;
    const finish=start+slice;
    const mid=start+slice/2;
    const chosen=i===wheelResultIndex;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,finish);
    ctx.closePath();
    ctx.fillStyle=chosen ? '#8C1F3D' : (i%2===0 ? '#080708' : '#F0ECEE');
    ctx.fill();
    ctx.strokeStyle='#8C1F3D';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx+Math.cos(mid)*208, cy+Math.sin(mid)*208);

    // Painted-on-board orientation:
    // 9 o'clock is upright; 3 o'clock is upside down.
    ctx.rotate(mid + Math.PI);

    ctx.fillStyle=chosen ? '#FFFFFF' : (i%2===0 ? '#F3EFF1' : '#090809');
    ctx.font="600 20px 'Oswald', Arial, sans-serif";
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    wrapText(item.name,0,0,148,21);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx,cy,radius,0,TAU);
  ctx.strokeStyle='#050405';
  ctx.lineWidth=12;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx,cy,radius-7,0,TAU);
  ctx.strokeStyle='#8C1F3D';
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx,cy,88,0,TAU);
  ctx.fillStyle='#080708';
  ctx.fill();
  ctx.strokeStyle='#8C1F3D';
  ctx.lineWidth=3;
  ctx.stroke();
}

function updateSpiritWheelResult(){
  const waiting=document.getElementById('spirit-wheel-waiting');
  const actions=document.getElementById('spirit-wheel-actions');
  const name=document.getElementById('spirit-wheel-result-name');
  const desc=document.getElementById('spirit-wheel-result-desc');
  const price=document.getElementById('spirit-wheel-result-price');
  const kicker=document.getElementById('spirit-wheel-result-kicker');
  if(!waiting || !actions) return;

  const items=wheelItems();
  const item=wheelResultIndex!=null ? items[wheelResultIndex] : null;

  if(item){
    waiting.hidden=true;
    actions.hidden=false;
    kicker.textContent='THE SPIRITS HAVE CHOSEN';
    name.textContent=item.name;
    desc.textContent=item.desc||'';
    price.textContent=wheelMoneyLine(item);
  }else{
    waiting.hidden=false;
    actions.hidden=true;
    kicker.textContent=wheelSpinning || wheelDragging ? 'THE WHEEL IS TURNING' : 'LET THE SPIRITS CHOOSE';
    name.textContent=wheelSpinning || wheelDragging ? '' : 'SPIN THE WHEEL';
    desc.textContent='';
    price.textContent='';
  }
}

function initSpiritWheel(){
  const canvas=document.getElementById('spirit-wheel-canvas');
  const centre=document.getElementById('spirit-wheel-centre');
  if(!canvas || !centre) return;

  drawSpiritWheel();
  wheelLastTickIndex=spiritWheelTickIndex();
  updateSpiritWheelResult();

  const TAU=Math.PI*2;
  const friction=0.986;
  const stopVelocity=0.00042;

  function shortDelta(a,b){
    let d=a-b;
    while(d>Math.PI)d-=TAU;
    while(d<-Math.PI)d+=TAU;
    return d;
  }

  function pointerAngle(e){
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*720;
    const y=(e.clientY-rect.top)/rect.height*720;
    return Math.atan2(y-360,x-360);
  }

  function finishSpin(){
    wheelVelocity=0;
    wheelSpinning=false;
    wheelRaf=null;
    wheelResultIndex=spiritWheelSelectedIndex();
    drawSpiritWheel();
    updateSpiritWheelResult();
    if('vibrate' in navigator){
      try{ navigator.vibrate([18,35,24]); }catch(e){}
    }
  }

  function animate(){
    if(wheelDragging) return;
    wheelRotation+=wheelVelocity;
    wheelVelocity*=friction;
    maybeSpiritWheelTick();
    drawSpiritWheel();

    if(Math.abs(wheelVelocity)>stopVelocity){
      wheelRaf=requestAnimationFrame(animate);
    }else{
      finishSpin();
    }
  }

  function beginInertia(){
    if(wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelResultIndex=null;
    wheelSpinning=true;
    updateSpiritWheelResult();

    if(Math.abs(wheelVelocity)<0.012){
      wheelVelocity+=(Math.random()>.5?1:-1)*0.018;
    }
    animate();
  }

  canvas.addEventListener('pointerdown',e=>{
    if(wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelRaf=null;
    wheelSpinning=false;
    wheelDragging=true;
    wheelVelocity=0;
    wheelResultIndex=null;
    wheelLastAngle=pointerAngle(e);
    wheelLastTime=performance.now();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    updateSpiritWheelResult();
    drawSpiritWheel();
  });

  canvas.addEventListener('pointermove',e=>{
    if(!wheelDragging) return;
    const now=performance.now();
    const a=pointerAngle(e);
    const d=shortDelta(a,wheelLastAngle);
    const dt=Math.max(8,now-wheelLastTime);
    wheelRotation+=d;
    const instantaneous=d*(16.67/dt);
    wheelVelocity=wheelVelocity*0.36+instantaneous*0.64;
    maybeSpiritWheelTick();
    wheelLastAngle=a;
    wheelLastTime=now;
    drawSpiritWheel();
  });

  function release(){
    if(!wheelDragging) return;
    wheelDragging=false;
    wheelVelocity=Math.max(-0.34,Math.min(0.34,wheelVelocity));
    beginInertia();
  }

  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',release);

  centre.addEventListener('click',()=>{
    if(wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelDragging=false;
    wheelVelocity=(Math.random()>.5?1:-1)*(0.16+Math.random()*0.11);
    beginInertia();
  });
}

  for(const cat of menu.categories){

function searchAllItems(q){
  q = q.trim().toLowerCase();
  const results = [];
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.name.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q)){
        results.push({ item, catName: cat.name });
      }
    });
  });
  return results;
}

  const stripped = String(raw).trim().replace(/%\s*(abv)?\s*$/i, '').trim();

}

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<div style="padding:60px 20px; text-align:center; color:#A79AA6;">Loading menu…</div>'; return; }
  if(barActive){ app.innerHTML = renderBarScreen(); return; }
  if(sentScreenOpen){ app.innerHTML = renderSentScreen(); return; }

  const prevCatScroll = document.querySelector('.cat-scroll');
  const catScrollX = prevCatScroll ? prevCatScroll.scrollLeft : 0;
  const prevSearchInput = document.getElementById('search-input');
  const searchFocused = !!(prevSearchInput && document.activeElement === prevSearchInput);
  const searchSelStart = searchFocused ? prevSearchInput.selectionStart : null;
  const searchSelEnd = searchFocused ? prevSearchInput.selectionEnd : null;
  const showStaffLinks = activeCat === 'liqueurs';

  let html = '';
  html += toastMsg ? `<div class="toast">${escapeHtml(toastMsg)}</div>` : '';
  html += `<header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        ${hasLogoImage
          ? `<img class="brand-logo" src="logo.jpg" alt="The Black Rose Tavern">`
          : `<div class="brand-text">
              <span class="brand-text-the">THE</span>
              <span class="brand-text-name">Black Rose<br>Tavern</span>
            </div>`}
      </div>
    </div>
  </header>`;

  html += '<main>';
  html += mode==='browse' ? renderBrowseView()
    : mode==='pin' ? renderPinScreen()
    : mode==='edit' ? renderEditView()
    : mode==='86' ? render86View()
    : renderBrowseView();
  html += '</main>';

  if(mode==='browse' && tableOrder && tableOrder.items.length && !orderSheetOpen){
    html += `<div class="order-bar"><div class="order-bar-inner" onclick="openOrderSheet()">
      <span>${escapeHtml(tableLabel)} · ${orderCount()} item${orderCount()!==1?'s':''} · ${money(orderTotal())}</span>
      <button class="cta" onclick="event.stopPropagation(); openOrderSheet()">View order</button>
    </div></div>`;
  }

  if(showStaffLinks){
    html += `<footer class="staff-footer">
      <p class="staff-footer-label">Staff tools · master PIN required</p>
      <div class="staff-footer-actions">
        <button class="staff-btn ${mode==='edit'?'active':''}" onclick="openStaffArea('edit')">Edit Menu</button>
        <button class="staff-btn ${mode==='86'?'active':''}" onclick="openStaffArea('86')">86 List</button>
        <button class="staff-btn ${barActive?'active':''}" onclick="openStaffArea('bar')">Bar Board</button>
      </div>
      ${staffAuthed ? `<button class="staff-lock-btn" onclick="lockStaffArea()">Lock staff access</button>` : ''}
    </footer>`;
  }

  if(wheelOpen){ html += renderWheelSheet(); }
  if(itemSheetOpen){ html += renderItemSheet(); }
  if(onboardingOpen){ html += renderOnboardingSheet(); }
  if(memberPromptOpen && memberPromptItem){ html += renderMemberPromptSheet(); }
  if(joinSheetOpen){ html += renderJoinSheet(); }
  if(quickAddItem){ html += renderQuickAddSheet(); }
  if(sendConfirmOpen){ html += renderSendConfirmSheet(); }
  else if(orderSheetOpen){ html += renderOrderSheet(); }
  if(dashPromptOpen && dashPromptItem){ html += renderDashSheet(); }
  if(icePromptOpen && icePromptItem){ html += renderIcePromptSheet(); }
  if(choicePromptOpen && choicePromptItem){ html += renderChoicePromptSheet(); }
  if(extraPromptOpen && extraPromptItem){ html += renderExtraPromptSheet(); }

  app.innerHTML = html;

  const newCatScroll = document.querySelector('.cat-scroll');
  if(newCatScroll && catScrollX){ newCatScroll.scrollLeft = catScrollX; }
  if(wheelOpen){ initSpiritWheel(); }

  if(searchFocused){
    const newSearchInput = document.getElementById('search-input');
    if(newSearchInput){
      newSearchInput.focus();
      if(searchSelStart != null && typeof newSearchInput.setSelectionRange === 'function'){
        try{ newSearchInput.setSelectionRange(searchSelStart, searchSelEnd); }catch(e){}
      }
    }
  }
}

function renderBrowseView(){

  let h = `<div class="toolbar">
    <button class="members-banner ${hasMembersCardImage ? '' : 'members-banner-solo'}" onclick="selectCat('members')">
      <span class="mb-text">
        <span class="mb-kicker">Membership</span>
        <span class="mb-title">Black Rose Members Card</span>
        <span class="mb-price">Just £4.00</span>
        <span class="mb-sub">Get yours at the bar · Tap for member prices</span>
      </span>
      ${hasMembersCardImage ? `<span class="mb-card-visual" aria-hidden="true">
        <img class="mb-card-img" src="members-card.jpg" alt="">
      </span>` : ''}
    </button>
    <button class="spin-cta" onclick="openWheel()" aria-label="Wanna play a game?">
      <span class="spin-copy">
        <span class="spin-title">Wanna play a game?</span>
      </span>
      <span class="spin-arrow" aria-hidden="true">›</span>
    </button>
    ${tableSlug
      ? `<div class="table-tag">Ordering for ${escapeHtml(tableLabel)} · <a href="#" onclick="leaveTable(); return false;" style="color:var(--text-dim);">change group</a></div>`
      : `<button class="group-order-hero" onclick="openJoin()">
          <span class="group-title">Start a group order</span>
          <span class="group-sub">Order together · Drink together</span>
        </button>`}
    <input type="text" id="search-input" placeholder="Search the menu…" value="${escapeHtml(query)}" oninput="query=this.value; render()">
  </div>`;

  if(!query.trim()){
    h += '<div class="group-toggle">';
    [['drink','Drinks'],['food','Food'],['members','Members']].forEach(([g,label])=>{
      h += `<button class="group-toggle-btn ${activeGroup===g?'active':''}" onclick="selectGroup('${g}')">${label}</button>`;
    });
    h += '</div>';
  }

  h += '<div class="cat-scroll">';
  categoriesInGroup(activeGroup).forEach(c=>{
    h += `<button class="cat-pill ${activeCat===c.id && !query.trim()?'active':''}" onclick="selectCat('${c.id}')">${escapeHtml(c.name)}</button>`;
  });
  h += '</div>';

  if(query.trim()){
    const results = searchAllItems(query);
    if(!results.length) h += `<div class="empty-state">Nothing matches your search.</div>`;
    else results.forEach(({item,catName})=>{ h += itemCardHtml(item,catName); });
  } else {
    const cat = menu.categories.find(c=>c.id===activeCat) || menu.categories[0];
    const items = cat ? cat.items : [];
    if(!items.length){
      h += `<div class="empty-state">Nothing in ${escapeHtml(cat.name)} yet.</div>`;
    } else if(cat && cat.id==='members'){
      h += renderMembersGrouped(cat);
    } else {
      items.forEach(it=>{ h += itemCardHtml(it); });
    }
  }
  return h;
}

function renderMembersGrouped(cat){
  let h = '';
  const hidden = cat.hiddenGroups || [];
  const card = cat.items.find(i=>i.isMembershipCard);
  if(card) h += itemCardHtml(card);
  const GROUP_ORDER = ['Draught','Bottles','Spirits','Cocktails','Shots'];
  GROUP_ORDER.forEach(group=>{
    if(hidden.includes(group)) return;
    const groupItems = cat.items.filter(i=>i.memberGroup===group);
    if(!groupItems.length) return;
    h += `<h3 class="member-group-heading">${escapeHtml(group)}</h3>`;
    groupItems.forEach(it=>{ h += itemCardHtml(it); });
  });
  return h;
}

    h += `<button class="btn-small" style="margin-top:8px;" onclick="openAddItem('${cat.id}')">+ Add item</button></div>`;
  });

  h += `<div class="cat-block">
    <label class="field-label" style="margin-top:0;">Add a new category</label>
    <div class="new-cat-row">
      <input type="text" placeholder="e.g. Seasonal Specials" value="${escapeHtml(newCatName)}" oninput="newCatName=this.value">

  </div>`;
  h += `<div class="cat-block">
    <label class="field-label" style="margin-top:0;">Menu file updates</label>
    <p style="font-size:12px; color:var(--text-dim); margin:0 0 10px 0; line-height:1.5;">
      This already runs automatically every time you unlock Edit mode — it
      pulls in new items, fixes any item silently pointing at the wrong
      thing, and fills in blank ABVs, all without touching prices or items
      you've edited. Use this if you want to check right now instead of
      waiting.
    </p>
    <button class="btn-small" onclick="syncNewMenuItems()">Check for new items</button>
  </div>`;

  h += `<div class="cat-block">
    <div class="cat-block-head" style="cursor:pointer;" onclick="toggleBackupsPanel()">
      <h3>Backups ${backupsPanelOpen?'▾':'▸'}</h3>
    </div>`;
  if(backupsPanelOpen){
    if(!backupsLoaded){
      h += `<div class="empty-state" style="padding:8px 0; text-align:left;">Loading…</div>`;
    } else if(!backupsList.length){
      h += `<div class="empty-state" style="padding:8px 0; text-align:left;">No backups yet — one is saved automatically every time the menu changes.</div>`;
    } else {
      h += `<p style="font-size:12px; color:var(--text-dim); margin:0 0 10px 0; line-height:1.5;">
        A snapshot is saved automatically every time the menu changes, keeping the most recent ${MAX_BACKUPS}. Restoring overwrites the whole menu with that snapshot — including any changes made since.
      </p>`;
      backupsList.forEach(b=>{
        h += `<div class="edit-item-row">
          <div>

          <div class="ei-actions">
            <button onclick="restoreBackup('${b.id}')">Restore</button>
          </div>
        </div>`;
      });
    }
  }
  h += `</div>`;
  return h;
}

  menu.categories.forEach(cat=>{

    h += `<div class="cat-block">

function toggle86(catId, itemId){
  const cat = menu.categories.find(c=>c.id===catId);
  const item = cat && cat.items.find(i=>i.id===itemId);
  if(!item) return;
  item.unavailable = !item.unavailable;
  saveMenu(item.unavailable ? (item.name+" 86'd") : (item.name+' back in stock'));
}

  }

  return `<div class="sent-shell">
    <div class="sent-check">✓</div>
    <p class="sent-eyebrow">Order Sent</p>

function renderBarScreen(){
  // Detail drill-down takes over the whole screen when a tile is open.
  const openOrder = barOpenSlug ? findBarOrder(barOpenSlug) : null;
  if(openOrder) return renderBarDetail(openOrder);

  const count = barOrders.length;
  const slots = Math.max(16, Math.ceil(count/4)*4); // always a full 4-wide grid, extra rows scroll
  const rows = slots/4;
  let tiles = '';
  for(let i=0; i<slots; i++){
    if(i < count){
      const o = barOrders[i];
      const slug = o.slug || slugify(o.displayLabel);
      const sentTs = o.sentAt || o.updatedAt;
      const fresh = (Date.now()-sentTs) < 60000;
      const lineCount = o.items.reduce((s,l)=>s+l.qty,0);
      tiles += `<div class="bar-tile ${fresh?'fresh':''}">
        ${fresh?'<span class="btdot"></span>':''}
        <div class="bar-tile-info" onclick="openBarOrder('${slug}')">
          <span class="btname">${escapeHtml(o.displayLabel)}</span>
          <span class="btcount">${lineCount} item${lineCount===1?'':'s'} · ${fmtElapsed(sentTs)}</span>
        </div>
        <div class="bar-tile-actions">
          <button class="bta-view" onclick="event.stopPropagation(); openBarOrder('${slug}')">View</button>
          <button class="bta-print" onclick="event.stopPropagation(); quickPrintOrder('${slug}')">Print</button>
          <button class="bta-clear" onclick="event.stopPropagation(); markServed('${slug}')">Clear</button>
        </div>
      </div>`;
    } else {
      tiles += `<div class="bar-tile empty"></div>`;
    }
  }

  return `<div class="bar-shell">
    <div class="bar-topbar">
      <h1>Bar Orders${count?` <span class="bar-count">(${count})</span>`:''}</h1>
      <a href="#" onclick="exitBarMode(); return false;" class="bar-exit">Back to menu</a>
    </div>
    ${count ? `<div class="bar-grid" style="grid-template-rows:repeat(${rows}, minmax(22vh,1fr));">${tiles}</div>` : `<div class="empty-state" style="padding:60px 20px;">No active group orders.</div>`}
  </div>`;
}

function renderBarDetail(o){
  const slug = o.slug || slugify(o.displayLabel);
  const sentTs = o.sentAt || o.updatedAt;
  const fresh = (Date.now()-sentTs) < 60000;

  return `<div class="bar-shell">
    <div class="bar-topbar">
      <h1>${escapeHtml(o.displayLabel)}</h1>
      <span class="bar-exit" style="text-decoration:none;">${fresh?'Sent just now':'Sent '+fmtElapsed(sentTs)}</span>
    </div>
    <div class="bar-detail-body">
      ${buildTicketHtml(o)}
    </div>
    <div class="bar-detail-actions">
      <button class="bar-action-btn bar-action-print" onclick="printBarOrder()">Print</button>
      <button class="bar-action-btn bar-action-clear" onclick="markServed('${slug}')">Clear</button>
      <button class="bar-action-btn bar-action-return" onclick="closeBarOrder()">Return</button>
    </div>
  </div>`;
}

// Lets a plain mouse wheel scroll the category tab row horizontally on
// desktop, where there's no touch-swipe and no visible affordance otherwise.
// Attached once to #app (never destroyed by re-renders) rather than to
// .cat-scroll itself (which gets recreated on every render).
document.getElementById('app').addEventListener('wheel', function(e){
  const catScroll = e.target.closest('.cat-scroll');
  if(!catScroll) return;
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    catScroll.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });

loadAll();
